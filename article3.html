Avec mon accolyte de toujours, Célian, nous avons longement contribué à CollabPatrol un projet permettant la collaboration des patrouilleurs d'un wiki (style Mediawiki) sur une page de différence.

Nous avons apporté diverses nouvelles fontionnalités comme les mentions (avec un notification via l'extension Echo désormais indispensable pour installer l'extension), une nouvelle interface en OOUI beaucoup plus propre notamment sur mobile et des optimisations diverses.
